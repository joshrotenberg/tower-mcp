[package]
name = "tower-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Tower-native Model Context Protocol (MCP) implementation"
documentation = "https://docs.rs/tower-mcp"
homepage = "https://github.com/joshrotenberg/tower-mcp"
readme = "../../README.md"
keywords = ["mcp", "tower", "json-rpc", "ai", "llm"]
categories = ["network-programming", "asynchronous"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
tower.workspace = true
tower-service.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
pin-project-lite = "0.2"
tower-mcp-types.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
async-trait.workspace = true
tracing.workspace = true
regex = "1"
base64.workspace = true
thiserror = { workspace = true }
sha2 = { workspace = true, optional = true }
# Required: task identifiers can act as bearer tokens and are generated from
# system entropy (SEP-2663).
getrandom = { workspace = true }
url = { workspace = true, optional = true }
urlencoding = { workspace = true, optional = true }
tower-resilience = { workspace = true, optional = true, default-features = false, features = ["circuitbreaker", "ratelimiter", "bulkhead"] }

[dev-dependencies]
async-trait.workspace = true
proptest = "1"
tokio-test = "0.4"
tower = { workspace = true, features = ["timeout", "limit"] }
tower-mcp-types = { path = "../tower-mcp-types", features = ["testing"] }
tower-resilience = { workspace = true, default-features = false, features = ["coalesce", "ratelimiter", "circuitbreaker"] }
tracing-subscriber.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "form"] }
jsonschema = "0.49"

[features]
default = []
# Enable all optional features
full = ["http", "websocket", "unix", "childproc", "oauth", "jwks", "testing", "dynamic-tools", "http-client", "oauth-client", "proxy", "macros", "resilience", "mcp-apps", "protocol-2026-07-28"]
# Transport features
http = ["dep:axum", "dep:hyper", "dep:http", "dep:http-body-util", "dep:tokio-stream", "dep:uuid"]
websocket = ["dep:axum", "dep:uuid"]
unix = ["http"]
childproc = []
# OAuth 2.1 resource server support
oauth = ["dep:jsonwebtoken", "http"]
# JWKS endpoint fetching for JWT validation (requires oauth)
jwks = ["oauth", "dep:reqwest"]
# Test utilities for MCP servers
testing = ["tower-mcp-types/testing"]
# HTTP client transport for connecting to remote MCP servers
http-client = ["dep:reqwest"]
# OAuth 2.0 client-side token acquisition (client credentials + authorization code)
oauth-client = ["http-client", "dep:sha2", "dep:urlencoding"]
# Runtime tool (de)registration via DynamicToolRegistry
dynamic-tools = []
# MCP proxy for aggregating multiple backend servers
proxy = []
# Re-export tower-resilience circuit breaker, rate limiter, and bulkhead with observable handles
resilience = ["dep:tower-resilience"]
# Proc macros for tool/resource/prompt definitions
macros = ["dep:tower-mcp-macros"]
# Typed server support for the stable MCP Apps extension (SEP-1865).
# Enabling the API does not advertise or activate the extension; applications
# must still call `McpRouter::with_mcp_apps`.
mcp-apps = ["dep:url"]
# Compile the released MCP 2026-07-28 implementation. Runtime clients and
# servers may narrow the compiled set with ProtocolSupport.
protocol-2026-07-28 = ["stateless"]
# Compatibility alias for the former feature name. New consumers should enable
# `protocol-2026-07-28`; existing `stateless` users retain the same behavior.
stateless = ["dep:sha2"]

[dependencies.axum]
workspace = true
optional = true

[dependencies.hyper]
version = "1"
optional = true

[dependencies.http]
version = "1"
optional = true

[dependencies.http-body-util]
version = "0.1"
optional = true

[dependencies.tokio-stream]
version = "0.1"
optional = true
features = ["sync"]

[dependencies.uuid]
version = "1"
optional = true
features = ["v4"]

[dependencies.jsonwebtoken]
version = "11"
optional = true
default-features = false
features = ["aws_lc_rs", "use_pem"]

[dependencies.tower-mcp-macros]
workspace = true
optional = true

[dependencies.reqwest]
version = "0.13"
optional = true
default-features = false
features = ["rustls", "json", "stream", "form"]
