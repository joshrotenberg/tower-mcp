[package]
name = "tower-mcp-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Proc macros for tower-mcp (optional convenience layer)"
documentation = "https://docs.rs/tower-mcp-macros"
homepage = "https://github.com/joshrotenberg/tower-mcp"
readme = "README.md"
keywords = ["mcp", "macros", "tower", "ai", "llm"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
