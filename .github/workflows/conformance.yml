name: MCP Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CONFORMANCE_VERSION: "0.2.0-alpha.10"

jobs:
  server-conformance:
    name: Server Conformance Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build conformance server
        run: cargo build --manifest-path examples/conformance-server/Cargo.toml

      - name: Start server
        run: |
          cargo run --manifest-path examples/conformance-server/Cargo.toml \
            > /tmp/conformance-server.log 2>&1 &
          echo $! > /tmp/conformance-server.pid

      - name: Wait for server
        run: |
          for _ in $(seq 1 30); do
            if nc -z 127.0.0.1 3001 2>/dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start. Logs:"
          cat /tmp/conformance-server.log
          exit 1

      - name: Run conformance suite
        run: |
          npx -y "@modelcontextprotocol/conformance@${CONFORMANCE_VERSION}" server \
            --url http://127.0.0.1:3001/mcp \
            --suite all \
            --spec-version 2025-11-25 \
            --expected-failures ./conformance-baseline.yml

      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/conformance-server.log

  stateless-conformance:
    name: Stateless 2026-07-28 Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build conformance server (with stateless feature)
        run: cargo build --manifest-path examples/conformance-server/Cargo.toml

      - name: Start server
        run: |
          cargo run --manifest-path examples/conformance-server/Cargo.toml \
            > /tmp/conformance-server-stateless.log 2>&1 &
          echo $! > /tmp/conformance-server-stateless.pid

      - name: Wait for server
        run: |
          for _ in $(seq 1 30); do
            if nc -z 127.0.0.1 3001 2>/dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start. Logs:"
          cat /tmp/conformance-server-stateless.log
          exit 1

      - name: Check server/discover (SEP-2575, #865)
        run: |
          # Use -D to dump response headers to a temp file, -o for the body.
          curl -s -X POST http://127.0.0.1:3001/mcp \
            -H "Content-Type: application/json" \
            -H "MCP-Protocol-Version: 2026-07-28" \
            -H "Mcp-Method: server/discover" \
            -d '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}' \
            -D /tmp/discover-headers.txt \
            -o /tmp/discover-body.json
          response=$(cat /tmp/discover-body.json)
          echo "server/discover response: $response"
          # DiscoverResult serializes as camelCase: supportedVersions, capabilities.
          # Server identity moved into _meta["io.modelcontextprotocol/serverInfo"]
          # in the final 2026-07-28 schema (it was a top-level serverInfo field
          # pre-finalization).
          echo "$response" | grep -q '"supportedVersions"' || { echo "FAIL: supportedVersions missing"; exit 1; }
          echo "$response" | grep -q '"io.modelcontextprotocol/serverInfo"' || { echo "FAIL: _meta serverInfo missing"; exit 1; }
          echo "$response" | grep -q '"capabilities"' || { echo "FAIL: capabilities missing"; exit 1; }
          echo "PASS: server/discover returned well-formed DiscoverResult"
          # server/discover must NOT set mcp-session-id: stateless responses are sessionless (#865)
          if grep -qi "mcp-session-id" /tmp/discover-headers.txt; then
            echo "FAIL: server/discover response must not include mcp-session-id header"
            cat /tmp/discover-headers.txt
            exit 1
          fi
          echo "PASS: server/discover response does not include mcp-session-id header"

      - name: Check final request without _meta is rejected (#952)
        run: |
          http_status=$(curl -s -o /tmp/missing-meta.json -w "%{http_code}" \
            -X POST http://127.0.0.1:3001/mcp \
            -H "Content-Type: application/json" \
            -H "MCP-Protocol-Version: 2026-07-28" \
            -H "Mcp-Method: tools/call" \
            -H "Mcp-Name: test_simple_text" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"test_simple_text","arguments":{}}}')
          response=$(cat /tmp/missing-meta.json)
          echo "stateless tools/call response: $response"
          test "$http_status" = "400" || { echo "FAIL: expected HTTP 400, got $http_status"; exit 1; }
          echo "$response" | grep -q -- '-32602' || { echo "FAIL: expected InvalidParams (-32602)"; exit 1; }
          echo "PASS: missing final request metadata rejected"

      - name: Check test_per_request_meta with _meta block (#870)
        run: |
          response=$(curl -s -X POST http://127.0.0.1:3001/mcp \
            -H "Content-Type: application/json" \
            -H "MCP-Protocol-Version: 2026-07-28" \
            -H "Mcp-Method: tools/call" \
            -H "Mcp-Name: test_per_request_meta" \
            -d '{
              "jsonrpc":"2.0","id":3,"method":"tools/call",
              "params":{
                "_meta":{
                  "io.modelcontextprotocol/protocolVersion":"2026-07-28",
                  "io.modelcontextprotocol/clientInfo":{"name":"test-client","version":"1.0"},
                  "io.modelcontextprotocol/clientCapabilities":{}
                },
                "name":"test_per_request_meta",
                "arguments":{}
              }
            }')
          echo "per_request_meta response: $response"
          echo "$response" | grep -q '2026-07-28' || { echo "FAIL: protocol_version not reflected"; exit 1; }
          echo "$response" | grep -q 'test-client' || { echo "FAIL: client_name not reflected"; exit 1; }
          echo "PASS: per-request _meta threaded to handler"

      - name: Check test_per_request_meta without _meta is rejected (#952)
        run: |
          http_status=$(curl -s -o /tmp/no-meta.json -w "%{http_code}" \
            -X POST http://127.0.0.1:3001/mcp \
            -H "Content-Type: application/json" \
            -H "MCP-Protocol-Version: 2026-07-28" \
            -H "Mcp-Method: tools/call" \
            -H "Mcp-Name: test_per_request_meta" \
            -d '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"test_per_request_meta","arguments":{}}}')
          response=$(cat /tmp/no-meta.json)
          echo "no-meta response: $response"
          test "$http_status" = "400" || { echo "FAIL: expected HTTP 400, got $http_status"; exit 1; }
          echo "$response" | grep -q -- '-32602' || { echo "FAIL: expected InvalidParams (-32602)"; exit 1; }
          echo "PASS: absent required _meta is rejected"

      - name: Check subscriptions/listen opens SSE stream with 2026-07-28 (#868)
        run: |
          # The final stream is sessionless. Capture the first SSE frame; curl
          # times out because the subscription intentionally remains open.
          curl -sN --max-time 2 \
            -X POST http://127.0.0.1:3001/mcp \
            -H "Content-Type: application/json" \
            -H "MCP-Protocol-Version: 2026-07-28" \
            -H "Mcp-Method: subscriptions/listen" \
            -H "Accept: text/event-stream" \
            -d '{"jsonrpc":"2.0","id":5,"method":"subscriptions/listen","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}},"notifications":{"toolsListChanged":true}}}' \
            -D /tmp/sse-headers.txt \
            -o /tmp/sse-stream.txt || true
          grep -qi "content-type: text/event-stream" /tmp/sse-headers.txt || { echo "FAIL: expected text/event-stream"; exit 1; }
          echo "SSE stream output:"
          cat /tmp/sse-stream.txt
          grep -q '"notifications/subscriptions/acknowledged"' /tmp/sse-stream.txt || { echo "FAIL: missing acknowledgment"; exit 1; }
          grep -q '"io.modelcontextprotocol/subscriptionId":5' /tmp/sse-stream.txt || { echo "FAIL: missing subscription ID"; exit 1; }
          echo "PASS: subscriptions/listen returned its tagged acknowledgment"

      - name: Check subscriptions/listen returns JSON-RPC error without 2026-07-28 (#868)
        run: |
          # Without MCP-Protocol-Version: 2026-07-28, subscriptions/listen must NOT
          # return an SSE stream. The 2025-11-25 server returns MethodNotFound
          # (-32601) because subscriptions/listen is a 2026-07-28-only method.
          # We assert the error code is exactly -32601 and no SSE stream is returned.
          content_type=$(curl -s -o /tmp/subscriptions-listen-legacy.json \
            -w "%{content_type}" \
            --max-time 3 \
            -X POST http://127.0.0.1:3001/mcp \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":8,"method":"subscriptions/listen","params":{}}' || true)
          response=$(cat /tmp/subscriptions-listen-legacy.json)
          echo "Legacy subscriptions/listen Content-Type: $content_type"
          echo "Legacy subscriptions/listen body: $response"
          echo "$content_type" | grep -vq "text/event-stream" || { echo "FAIL: must not return SSE stream without 2026-07-28"; exit 1; }
          echo "$response" | grep -q '"error"' || { echo "FAIL: expected a JSON-RPC error field"; exit 1; }
          echo "$response" | grep -q -- '-32601' || { echo "FAIL: expected MethodNotFound error code -32601"; exit 1; }
          echo "PASS: subscriptions/listen returns MethodNotFound (-32601) without 2026-07-28 version"

      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/conformance-server-stateless.log

  client-conformance:
    name: Client Conformance Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build conformance client
        run: cargo build --manifest-path examples/conformance-client/Cargo.toml

      - name: Run client conformance suite
        run: |
          # The empty baseline makes any regression fail immediately.
          npx -y "@modelcontextprotocol/conformance@${CONFORMANCE_VERSION}" client \
            --suite all \
            --spec-version 2025-11-25 \
            --command "cargo run --manifest-path examples/conformance-client/Cargo.toml --" \
            --expected-failures ./conformance-baseline-client.yml

  draft-conformance:
    name: Official 2026-07-28 Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build conformance server
        run: cargo build --manifest-path examples/conformance-server/Cargo.toml

      - name: Start server
        run: |
          cargo run --manifest-path examples/conformance-server/Cargo.toml \
            > /tmp/conformance-server-draft.log 2>&1 &
          echo $! > /tmp/conformance-server-draft.pid

      - name: Wait for server
        run: |
          for _ in $(seq 1 30); do
            if nc -z 127.0.0.1 3001 2>/dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start. Logs:"
          cat /tmp/conformance-server-draft.log
          exit 1

      - name: Run official 2026-07-28 suite
        run: |
          # The current 0.2.0-alpha.x package carries the final 2026-07-28
          # scenarios. --suite all includes all final-protocol checks,
          # including stateless requests, caching, header validation, and
          # the 14 MRTR input-required-result scenarios. The empty baseline
          # keeps CI strict if a regression appears.
          npx -y "@modelcontextprotocol/conformance@${CONFORMANCE_VERSION}" server \
            --url http://127.0.0.1:3001/mcp \
            --spec-version 2026-07-28 \
            --suite all \
            --expected-failures ./conformance-baseline-draft.yml

      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/conformance-server-draft.log

  draft-client-conformance:
    name: Official 2026-07-28 Client Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build conformance client
        run: cargo build --manifest-path examples/conformance-client/Cargo.toml

      - name: Run official 2026-07-28 client suite
        run: |
          # The client half of the final-version suite (#1027): the other three jobs
          # cover stable client, stable server and final-version server, so this was
          # the least-visible coverage gap. Known gaps are inventoried in
          # The empty baseline makes any regression fail immediately.
          #
          # pipefail so the tee below cannot mask the tool's exit code (the
          # Actions default bash already sets it; stated here because the
          # gating depends on it).
          set -o pipefail
          npx -y "@modelcontextprotocol/conformance@${CONFORMANCE_VERSION}" client \
            --suite all \
            --spec-version 2026-07-28 \
            --command "cargo run --manifest-path examples/conformance-client/Cargo.toml --" \
            --expected-failures ./conformance-baseline-draft-client.yml \
            | tee /tmp/conformance-draft-client.log

      - name: Publish suite summary
        if: always()
        run: |
          # The exit code answers "did anything regress"; the absolute counts
          # record the current suite size. Both come
          # from the single run above, so this step only reformats its output.
          log=/tmp/conformance-draft-client.log
          if [ ! -s "$log" ]; then
            echo "No suite output to summarize." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sed 's/\x1b\[[0-9;]*m//g' "$log" > /tmp/conformance-draft-client-clean.log
          clean=/tmp/conformance-draft-client-clean.log
          {
            echo '## Official 2026-07-28 client suite'
            echo
            if grep -q '^Total:' "$clean"; then
              echo "Unbaselined: $(grep -m1 '^Total:' "$clean" | sed 's/^Total: //')"
            else
              echo 'Suite did not reach a summary; see the job log.'
            fi
            echo
            echo '<details><summary>Per-scenario results and baseline verdict</summary>'
            echo
            echo '```text'
            sed -n '/=== SUITE SUMMARY ===/,$p' "$clean"
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
