name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE-*"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE-*"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --all-features

  feature-combinations:
    name: Feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check default and each public feature
        run: |
          cargo check -p tower-mcp --all-targets
          for feature in \
            http websocket unix childproc oauth jwks testing dynamic-tools \
            http-client oauth-client proxy macros resilience mcp-apps \
            protocol-2026-07-28 stateless
          do
            cargo check -p tower-mcp --all-targets --features "$feature"
          done

  wasm-types:
    name: WASM (tower-mcp-types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target wasm32-unknown-unknown -p tower-mcp-types

  # SemVer check is disabled pre-1.0 -- see the tracking issue for the
  # re-enable plan. While the crate is in active 0.x development tracking
  # rapid MCP spec change, essentially every PR is a `feat!:` breaking
  # change by strict semver rules, so the check is pure noise. Convention
  # is to mark breaking commits with `!` (per CLAUDE.md) and let
  # release-plz drive 0.x -> 0.(x+1).0 bumps from the commit log.
  #
  # semver:
  #   name: SemVer
  #   if: github.event_name == 'pull_request'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: dtolnay/rust-toolchain@stable
  #     - uses: Swatinem/rust-cache@v2
  #     - uses: obi1kenobi/cargo-semver-checks-action@v2
  #       with:
  #         package: tower-mcp,tower-mcp-types

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        exclude:
          # Beta on Windows tends to be flaky, skip it
          - os: windows-latest
            rust: beta
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.rust == 'beta' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --all-features

  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --all-features

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -Dwarnings

  # Line, region and function coverage. Branch coverage is deliberately
  # absent: `cargo llvm-cov --branch` needs nightly, and on this workspace
  # the nightly llvm-cov crashes (SIGSEGV) generating any report format
  # from branch-instrumented data. Revisit when that stabilises.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      COVERAGE_MIN_LINES: "80"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run tests with coverage instrumentation
        run: cargo llvm-cov --workspace --all-features --no-report
      - name: Generate reports
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --json --summary-only --output-path coverage-summary.json
          cargo llvm-cov report > coverage.txt
          cargo llvm-cov report --html --output-dir coverage-html
      - name: Write job summary
        run: |
          jq -r '
            .data[0].totals
            | "| Metric | Covered | Total | Percent |",
              "| --- | ---: | ---: | ---: |",
              "| Lines | \(.lines.covered) | \(.lines.count) | \(.lines.percent * 100 | round / 100)% |",
              "| Regions | \(.regions.covered) | \(.regions.count) | \(.regions.percent * 100 | round / 100)% |",
              "| Functions | \(.functions.covered) | \(.functions.count) | \(.functions.percent * 100 | round / 100)% |"
          ' coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "Line coverage must remain at or above ${COVERAGE_MIN_LINES}%."
            echo "Detailed reports are attached to the run as the \`coverage\` artifact."
            echo ""
            echo "<details><summary>Per-file coverage</summary>"
            echo ""
            echo '```'
            cat coverage.txt
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            lcov.info
            coverage-summary.json
            coverage.txt
            coverage-html/
      - name: Enforce line coverage floor
        run: |
          measured="$(jq -r '.data[0].totals.lines.percent' coverage-summary.json)"
          echo "Measured line coverage: ${measured}% (required: ${COVERAGE_MIN_LINES}%)"
          if ! cargo llvm-cov report --fail-under-lines "${COVERAGE_MIN_LINES}"; then
            echo "::error title=Line coverage below ${COVERAGE_MIN_LINES}%::Measured line coverage ${measured}% is below the required ${COVERAGE_MIN_LINES}% floor."
            exit 1
          fi

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build all examples
        run: |
          cargo build -p tower-mcp-examples --examples --all-features
      - name: Build workspace example crates
        run: |
          cargo build -p mcp-repl
          cargo build --manifest-path examples/conformance-server/Cargo.toml
          cargo build --manifest-path examples/codegen-mcp/Cargo.toml

  rmcp-compat:
    name: rmcp 3.1 wire compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run differential compatibility harness
        run: cargo run --locked -p rmcp-compat
