name: Release-plz

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main

# Merges close together used to start runs in parallel, and whichever
# finished last force-pushed the release PR. When that was the run for the
# older commit, the PR described a main that no longer existed: merging
# two PRs six seconds apart left the release PR at 0.22.3 without the second
# one. Queueing makes the newest state the last one written.
#
# Not cancelled: this job also publishes to crates.io, and a publish must
# never be stopped partway through.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
