[workspace]
resolver = "3"
members = [
    "crates/tower-mcp",
    "crates/tower-mcp-types",
    "crates/tower-mcp-macros",
    "examples",
    "examples/conformance-server",
    "examples/conformance-client",
    "examples/codegen-mcp",
    "examples/mcp2md",
    "tools/interop-probe",
    "tools/rmcp-compat",
    "tools/sdk-interop",
]

[workspace.package]
version = "0.21.0"
edition = "2024"
rust-version = "1.90"
authors = ["Josh Rotenberg <joshrotenberg@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/tower-mcp"

[workspace.dependencies]
# Internal crates
tower-mcp = { version = "0.21", path = "crates/tower-mcp" }
tower-mcp-types = { version = "0.21", path = "crates/tower-mcp-types" }
tower-mcp-macros = { version = "0.21", path = "crates/tower-mcp-macros" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
# `preserve_order` keeps `Value` maps in document order. Every response is
# serialized through `Value` in the JSON-RPC layer, and elicitation form
# fields render in declaration order, so without this the ordered schema map
# is re-sorted on the way out (#1199).
serde_json = { version = "1.0", features = ["preserve_order"] }

# Schema generation
schemars = "1.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Web framework
axum = { version = "0.8", features = ["json", "ws"] }

# Error handling
thiserror = "2"

# Encoding
base64 = "0.23.0"
# Elicitation form fields render in declaration order, so their schema map
# must preserve insertion order (#1199).
indexmap = { version = "2", features = ["serde"] }
# Client-side WebSocket. The server side rides on axum, but a client needs its
# own implementation.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

# Crypto
sha2 = "0.11"
getrandom = "0.4"

# URL handling
url = "2"
urlencoding = "2"

# Tower ecosystem
tower = { version = "0.5", features = ["util"] }
tower-service = "0.3"
tower-resilience = { version = "0.10.0", default-features = false, features = ["bulkhead", "ratelimiter", "coalesce", "circuitbreaker"] }

# Async
futures = "0.3"
async-trait = "0.1"
tokio-util = { version = "0.7", default-features = false }
