[package]
name = "lua-tools-example"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Example: MCP tools defined in Lua files, served by tower-mcp"

[dependencies]
tower-mcp = { workspace = true, features = ["dynamic-tools", "schema-validation"] }
# No `send` feature: the Lua state stays on one thread behind a channel (see
# the "handlers backed by a !Send runtime" guide), so `Lua` need not be
# `Send`. No other Lua version feature is enabled either: mlua-sys accepts
# exactly one, and `--all-features` must keep building.
mlua = { version = "=0.12.2", default-features = false, features = ["lua54", "vendored", "async", "serde"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tower-mcp = { workspace = true, features = ["dynamic-tools", "schema-validation", "testing"] }
tempfile = "3"
