[package]
name = "mcp2md"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/joshrotenberg/tower-mcp"
readme = "README.md"
description = "Generate Markdown documentation from an MCP server's discovered surface"
keywords = ["mcp", "markdown", "documentation", "cli", "client"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mcp2md"
path = "src/main.rs"

[dependencies]
tower-mcp = { workspace = true, features = ["http-client", "protocol-2026-07-28"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
