[package]
name = "mcp-repl"
version = "0.1.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/joshrotenberg/tower-mcp"
readme = "README.md"
description = "Interactive MCP client REPL: connects to any MCP server and turns its tools, prompts, and resources into the command set"
keywords = ["mcp", "repl", "cli", "client", "protocol"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mcp-repl"
path = "src/main.rs"

[dependencies]
tower-mcp = { workspace = true, features = ["http-client", "protocol-2026-07-28"] }
async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "1"
toml_edit = "0.25"
clap.workspace = true
tracing-subscriber.workspace = true
reedline = { version = "0.49", features = ["external_printer"] }
nu-ansi-term = "0.50"

[dev-dependencies]
tempfile = "3"
